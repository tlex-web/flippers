<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Sandbox — Flippers</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060d;
      }
      #sandbox {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #stage {
        display: block;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      }
      /* Score HUD (GAME-01): system-font DOM text, crisp at any canvas fit. */
      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        background: rgba(5, 6, 13, 0.72);
        border: 1px solid rgba(138, 160, 255, 0.25);
        border-radius: 8px;
        color: #e8eefc;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        pointer-events: none;
      }
      .hud-label {
        font-size: 11px;
        letter-spacing: 0.18em;
        color: #8892b0;
      }
      .hud-score {
        font-size: 32px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .hud-ball {
        margin-top: 4px;
        font-size: 16px;
        color: #c3cbe6;
      }
      /* Game status (GAME-02/03): the one announced line; min-height keeps the
         panel from jumping when it empties. */
      .hud-status {
        min-height: 1.2em;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #ffd166;
      }
      /* Controls hint (G-04-6, 04-UI-REVIEW #6): a static key/action list, not
         announced. Each row's key caps stay on one line. */
      .hud-controls {
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 12px;
        row-gap: 4px;
        margin: 10px 0 0;
        font-size: 12px;
        line-height: 1.5;
        color: #8892b0;
      }
      .hud-controls dt {
        margin: 0;
      }
      .hud-controls dd {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .hud-controls kbd {
        font: inherit;
        min-width: 1.2em;
        padding: 0 4px;
        text-align: center;
        border: 1px solid rgba(138, 160, 255, 0.35);
        border-radius: 3px;
        background: rgba(138, 160, 255, 0.08);
        color: #c3cbe6;
      }
      /* Diagnosis readout (G-04-6): DOM text, legible at any canvas fit. A
         developer readout, so it is hidden from assistive tech. */
      .hud-diag {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 6px 10px;
        background: rgba(5, 6, 13, 0.72);
        border: 1px solid rgba(138, 160, 255, 0.25);
        border-radius: 6px;
        color: #8892b0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Throwaway diagnosis sandbox (D-06/D-07): live interpolated ball + HUD.
         The real procedural renderer is Phase 5; do not build on this. -->
    <main id="sandbox">
      <canvas id="stage" role="img" aria-label="Flippers pinball table"></canvas>
      <div id="hud" class="hud">
        <div class="hud-label">SCORE</div>
        <div id="hud-score" class="hud-score">0</div>
        <div id="hud-ball" class="hud-ball"></div>
        <div id="hud-status" class="hud-status" role="status" aria-live="polite"></div>
        <dl id="hud-controls" class="hud-controls">
          <dt>Start</dt>
          <dd><kbd>Enter</kbd></dd>
          <dt>Launch</dt>
          <dd><kbd>Space</kbd> hold, release</dd>
          <dt>Left flipper</dt>
          <dd><kbd>Z</kbd><kbd>←</kbd><kbd>Left Shift</kbd></dd>
          <dt>Right flipper</dt>
          <dd><kbd>/</kbd><kbd>→</kbd><kbd>Right Shift</kbd></dd>
          <dt>Nudge</dt>
          <dd><kbd>X</kbd><kbd>.</kbd><kbd>↑</kbd></dd>
        </dl>
      </div>
      <div id="hud-diag" class="hud-diag" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/sandbox/main.ts"></script>
  </body>
</html>
