<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Sandbox — Flippers</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060d;
      }
      #sandbox {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #stage {
        display: block;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      }
      /* Score HUD (GAME-01): system-font DOM text, crisp at any canvas fit. */
      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        background: rgba(5, 6, 13, 0.72);
        border: 1px solid rgba(138, 160, 255, 0.25);
        border-radius: 8px;
        color: #e8eefc;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        pointer-events: none;
      }
      .hud-label {
        font-size: 11px;
        letter-spacing: 0.18em;
        color: #8892b0;
      }
      .hud-score {
        font-size: 32px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <!-- Throwaway diagnosis sandbox (D-06/D-07): live interpolated ball + HUD.
         The real procedural renderer is Phase 5; do not build on this. -->
    <main id="sandbox">
      <canvas id="stage" role="img" aria-label="Flippers pinball table"></canvas>
      <div id="hud" class="hud">
        <div class="hud-label">SCORE</div>
        <div id="hud-score" class="hud-score">0</div>
      </div>
    </main>
    <script type="module" src="/src/sandbox/main.ts"></script>
  </body>
</html>
